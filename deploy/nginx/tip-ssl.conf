# ==============================================================================
# Threat Intelligence Platform (TIP) - Production Nginx Reverse Proxy & TLS Config
# ==============================================================================
# Features:
# 1. Automatic HTTP to HTTPS 301 redirection
# 2. Strong TLSv1.2 & TLSv1.3 configuration with modern cipher suites
# 3. HTTP Strict Transport Security (HSTS) with includeSubDomains & preload
# 4. ProxyFix headers (X-Forwarded-For, X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-Port)
# 5. Security headers and upload size limits
# ==============================================================================

upstream tip_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. HTTP Server - Redirect all plaintext traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tip.yourdomain.com; # Replace with your production domain / IP

    # Let's Encrypt / Certbot ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - TLS Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tip.yourdomain.com; # Replace with your production domain / IP

    # ── SSL Certificate & Key Paths ───────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/tip.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tip.yourdomain.com/privkey.pem;

    # ── TLS Protocols & Cipher Suites ─────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # ── SSL Session Caching ───────────────────────────────────────────────────
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ── OCSP Stapling ─────────────────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers ──────────────────────────────────────────────────────
    # HSTS (HTTP Strict Transport Security) - 1 year TTL
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Client Payload & Buffer Limits ────────────────────────────────────────
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # ── Reverse Proxy Pass to Flask Application ───────────────────────────────
    location / {
        proxy_pass http://tip_backend;
        proxy_http_version 1.1;

        # TLS Termination Headers for ProxyFix
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        # Connection optimizations
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Inbound SIEM / EDR Webhook Ingestion Route ─────────────────────────────
    location /api/v1/webhook/ {
        proxy_pass http://tip_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Keep original request body intact for HMAC signature verification
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
    }

    # ── Static Files (Cached Directly by Nginx) ───────────────────────────────
    location /static/ {
        alias /path/to/threat_intelligence_platform/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
